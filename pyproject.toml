[project]
name = "inbox-agent"
version = "0.1.0"
description = "A real estate inbox agent you'd actually trust — with the evaluations to prove it."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain>=1.4,<2",
    "langgraph>=1.2,<2",
    "langchain-core>=1.6,<2",
    "langchain-anthropic>=1.7.5,<2",
    "langchain-fireworks>=1.7,<2",
    "langsmith>=0.14,<0.15",
    "openevals>=0.2,<0.3",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "rich>=13.7",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
jev = ["langchain-typesafe==0.0.1a3"]

[project.scripts]
rei = "inbox_agent.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inbox_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that call external APIs (excluded by default)"]
addopts = "-m 'not network' -q"
filterwarnings = ["ignore::DeprecationWarning"]
